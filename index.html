<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesan Seragam &amp; Atribut Sekolah — MIG Digital Printing</title>
  <meta name="description" content="Lihat ukuran dan harga seragam &amp; atribut sekolah, lalu kirim pesanan lewat WhatsApp.">
  <meta name="theme-color" content="#1c2430">
  <!-- Preview saat link dibagikan di WhatsApp. Kalau nanti mau ada gambar
       preview, tambahkan <meta property="og:image" content="https://.../gambar.jpg">
       (harus alamat lengkap, bukan nama file saja). -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pesan Seragam &amp; Atribut Sekolah — MIG Digital Printing">
  <meta property="og:description" content="Lihat ukuran dan harga, pilih barangnya, lalu kirim pesanan lewat WhatsApp.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E👕%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Foto produk (lh3) dan data produk (Apps Script) dimuat tanpa mode CORS,
       jadi preconnect-nya sengaja tanpa atribut crossorigin. -->
  <link rel="preconnect" href="https://lh3.googleusercontent.com">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://script.googleusercontent.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c2430;
      --paper: #f6f5f1;
      --line: #dcd8cf;
      --accent: #7B29BA;
      --accent-dark: #5c1f8c;
      --warn: #e0261f;
      /* Dipakai khusus untuk info non-blocking (stok rendah, lengkapi pilihan) —
         dipisah dari --warn biar gak disamakan sama error sungguhan. */
      --peringatan: #b7791f;
      --muted: #6b7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Sora', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    header {
      background: var(--ink);
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }
    header h1 { font-size: 16px; margin: 0; letter-spacing: .3px; }
    header span { font-size: 12px; color: #f6f5f1; }

    .keterangan {
      background: #fff3d6;
      color: #7a4a00;
      padding: 10px 16px;
      font-size: 13px;
      line-height: 1.5;
      border-bottom: 1px solid #f0dca0;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }
    .keterangan .ikon { flex-shrink: 0; font-size: 15px; }

    .layout {
      display: flex;
      flex-direction: column;
      min-height: calc(100vh - 50px);
    }
    @media (min-width: 860px) {
      .layout { flex-direction: row; }
      .panel-produk { flex: 1.5; border-right: 1px solid var(--line); }
      .panel-keranjang {
        flex: 1;
        height: calc(100vh - 50px);
        position: sticky;
        top: 0;
        overflow-y: auto;
    }
    }

    .panel-produk { padding: 14px; }
    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .filters input {
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      background: #fff;
    }
    .filters input { flex: 1; min-width: 140px; }

    /* Pil kategori — dipakai kalau kategorinya sedikit, jadi langsung kelihatan
       semua tanpa perlu buka dropdown */
    .kategori-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .pil-kategori {
      border: 1px solid var(--line);
      background: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      color: var(--ink);
      white-space: nowrap;
      transition: transform .08s, background .1s;
    }
    .pil-kategori:active { transform: scale(.94); }
    .pil-kategori.aktif { background: var(--ink); border-color: var(--ink); color: #fff; }

    .grid-produk {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }
    .kartu-grid {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      text-align: left;
      cursor: pointer;
      font-family: inherit;
      color: inherit;
    }
    .kartu-grid:disabled { opacity: .55; cursor: not-allowed; }
    .gambar-produk {
      aspect-ratio: 1 / 1;
      background-size: cover;
      background-position: center;
      background-color: #ecebe6;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .fallback-foto {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--muted);
    }
    .fallback-foto svg { width: 30px; height: 30px; opacity: .4; }
    .fallback-foto span { font-size: 11px; opacity: .7; }
    .label-habis {
      position: absolute;
      inset: 0;
      background: rgba(28,36,48,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .label-habis span {
      background: #fff;
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
    }
    .info-grid { padding: 8px 10px 10px; }
    .nama-grid { font-weight: 400; font-size: 14px; line-height: 1.5; margin-bottom: 4px; }
    .harga-grid { font-size: 18px; color: var(--ink); font-weight: 700; }
    .harga-grid .satuan { font-size: 12px; font-weight: 400; color: var(--muted); }
    /* Foto kartu pakai <img> (bukan background) supaya bisa lazy-load: foto yang
       belum kelihatan di layar tidak ikut diunduh dulu. */
    .foto-produk {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .kartu-skeleton {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
    }
    .skeleton-gambar {
      aspect-ratio: 1 / 1;
      background: linear-gradient(90deg, #eae7df 25%, #f6f4ef 37%, #eae7df 63%);
      background-size: 400% 100%;
      animation: kilau 1.4s ease infinite;
    }
    .skeleton-baris {
      height: 10px;
      margin: 10px 10px 0;
      border-radius: 4px;
      background: linear-gradient(90deg, #eae7df 25%, #f6f4ef 37%, #eae7df 63%);
      background-size: 400% 100%;
      animation: kilau 1.4s ease infinite;
    }
    .skeleton-baris.pendek { width: 45%; margin-bottom: 10px; }
    .skeleton-baris.panjang { width: 80%; }
    @keyframes kilau {
      0% { background-position: 100% 50%; }
      100% { background-position: 0 50%; }
    }

    .header-produk { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .header-produk .nama { font-weight: 700; font-size: 18px; }
    .header-produk .kategori { font-size: 12px; color: var(--muted); white-space: nowrap; }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(20,16,10,.45);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .modal-overlay.terbuka { opacity: 1; pointer-events: auto; }
    .modal-sheet {
      background: #fff;
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 16px 16px 0 0;
      padding: 16px;
      position: relative;
      transform: translateY(16px);
      transition: transform .25s ease;
    }
    /* Gambar sengaja dipisah jadi wrapper sendiri (di luar .modal-scroll):
       di HP dia nempel diam di atas (gak ikut discroll bareng chip varian),
       di desktop dia jadi kolom kiri lewat CSS grid di bawah. */
    .modal-gambar-wrap { flex-shrink: 0; }
    /* Area ini yang discroll, bukan .modal-sheet — jadi tombol X di luar
       area ini tetap diam di tempat walau isi modalnya digulir ke bawah. */
    .modal-scroll {
      overflow-y: auto;
      flex: 1;
      min-height: 0;
    }
    /* Footer aksi (qty + tombol Tambah) sengaja diletakkan DI LUAR .modal-scroll
       supaya selalu kelihatan menempel di bawah modal, gak ikut ke-scroll
       walau daftar pilihan varian (Jurusan/Lengan/Ukuran) panjang. */
    .modal-footer {
      flex-shrink: 0;
      padding-top: 12px;
      margin-top: 8px;
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .modal-overlay.terbuka .modal-sheet { transform: translateY(0); }
    @media (min-width: 860px) {
      .modal-overlay { align-items: center; }
      .modal-sheet { border-radius: 16px; }
      /* Di desktop, space kiri-kanan masih luas — jadi gambar & varian
         disusun berdampingan (grid 2 kolom) biar semuanya kelihatan
         sekaligus tanpa perlu scroll. Footer (qty + tombol Tambah)
         dibentangkan penuh di baris paling bawah. */
      .modal-sheet {
        display: grid;
        grid-template-columns: minmax(220px, 300px) 1fr;
        grid-template-rows: 1fr auto;
        grid-template-areas:
          "gambar konten"
          "footer footer";
        column-gap: 24px;
        max-width: 760px;
        max-height: 82vh;
      }
      .modal-gambar-wrap { grid-area: gambar; }
      .modal-scroll {
        grid-area: konten;
        max-height: 100%;
        padding-right: 40px; /* jaga jarak dari tombol ✕ di pojok kanan atas */
        display: flex;
        flex-direction: column;
        justify-content: center; /* produk tanpa varian (info pendek) gak numpuk di atas doang */
        justify-content: safe center; /* browser modern: kalau kontennya panjang (varian banyak), tetap bisa discroll penuh */
      }
      .modal-footer { grid-area: footer; margin-top: 16px; padding-top: 16px; }
      .modal-gambar { margin-bottom: 0; }
    }
    .modal-tutup {
      position: absolute;
      top: 10px; right: 10px;
      width: 32px; height: 32px;
      border: none;
      background: #f1efe9;
      border-radius: 50%;
      font-size: 15px;
      cursor: pointer;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .modal-gambar {
      width: 100%;
      aspect-ratio: 4 / 3;
      background-size: cover;
      background-position: center;
      background-color: #ecebe6;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* HP: foto dikecilkan kalau produknya punya banyak pilihan (jurusan/lengan/
       ukuran), supaya chip pilihan dapat tempat lebih luas dan gak perlu digulir jauh. */
    @media (max-width: 859px) {
      .modal-gambar.ringkas { max-height: 26vh; }
      .modal-scroll { padding-bottom: 8px; }
    }
    .modal-sheet .baris-dropdown { margin-top: 6px; }
    .modal-sheet .baris-aksi { margin-top: 14px; }
    .ket-produk { font-size: 13px; line-height: 1.5; color: var(--muted); margin-top: 6px; }

    .baris-dropdown { display: flex; flex-direction: column; gap: 8px; }
    .label-chip { font-size: 13px; color: var(--muted); margin-bottom: 4px; }
    .label-chip.ada-link { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .link-panduan {
      color: var(--accent);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
      padding: 4px 0;
    }
    .chip-baris { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line);
      background: #fff;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 16px;
      cursor: pointer;
      user-select: none;
      transition: transform .08s, background .1s;
    }
    .chip:active { transform: scale(.93); }
    .chip.aktif { background: var(--ink); border-color: var(--ink); color: #fff; }
    .chip.habis {
      opacity: .4;
      text-decoration: line-through;
      cursor: not-allowed;
      background: #f1efe9;
    }
    .chip.habis:active { transform: none; }

    .info-pilihan {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      min-height: 18px;
      margin-top: 24px;
    }
    .info-pilihan .harga { font-size: 18px; font-weight: 700; }
    .info-pilihan .stok { color: var(--muted); }
    .info-pilihan .stok.rendah { color: var(--peringatan); font-weight: 600; }
    .info-pilihan .harga .satuan { font-size: 12px; font-weight: 400; color: var(--muted); }
    /* Harga & stok sekarang ada di footer (di atas tombol Tambah), jadi selalu
       kelihatan walau daftar pilihan panjang. Petunjuk "pilih ... dulu" pindah
       ke tulisan tombol Tambah itu sendiri. */
    .modal-footer .info-pilihan { margin: 0 0 10px; }
    .modal-footer .info-pilihan + .baris-aksi { margin-top: 0; }
    .baris-aksi {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: auto;
    }
    .qty-ctl {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 2px 6px;
    }
    .qty-ctl button {
      width: 38px; height: 38px;
      border: none;
      background: none;
      font-size: 15px;
      cursor: pointer;
      color: var(--ink);
    }
    .qty-ctl span { min-width: 18px; text-align: center; font-size: 13px; }

    .btn-tambah {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 7px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .05s, background .05s;
    }
    /* Kondisi mati sekarang memuat petunjuk ("Pilih jurusan dulu"), jadi
       teksnya harus terbaca — bukan putih di atas abu-abu muda. */
    .btn-tambah:disabled { background: #e6e3db; color: #5b6472; cursor: not-allowed; }
    .btn-tambah:hover:not(:disabled) { background: #000; }
    .btn-tambah:active:not(:disabled) { transform: scale(.9); background: #000; }

    .panel-keranjang {
      background: #fff;
      border-top: 1px solid var(--line);
      padding: 14px;
      display: flex;
      flex-direction: column;
    }

    @media (max-width: 859px) {
  .panel-keranjang {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    max-height: 75vh;
    overflow-y: auto;
    background: #fff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 14px rgba(0,0,0,.15);
    padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    transform: translateY(100%);
    transition: transform .25s ease;
    z-index: 50;
  }
  .panel-keranjang.menyeret { transition: none; }
  .panel-keranjang.buka { transform: translateY(0); }
  .drag-handle {
    width: 36px; height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 8px auto 0;
    flex-shrink: 0;
  }
  .tutup-keranjang-mobile {
    position: absolute;
    top: 12px; right: 12px;
    width: 32px; height: 32px;
    border: none;
    background: #f1efe9;
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .fab-keranjang {
    display: flex;
    align-items: center;
    justify-content: center;
    position: fixed;
    right: 16px;
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: 56px; height: 56px;
    border: none;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,.3);
    cursor: pointer;
    z-index: 60;
  }
  .fab-keranjang svg { width: 24px; height: 24px; }
  .badge-keranjang {
    position: absolute;
    top: -4px; right: -4px;
    min-width: 20px; height: 20px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--warn);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #fff;
  }
  .pop { animation: popKeranjang .35s ease; }
  @keyframes popKeranjang {
    0% { transform: scale(1); }
    35% { transform: scale(1.3); }
    60% { transform: scale(.92); }
    100% { transform: scale(1); }
  }

  body { padding-bottom: 88px; }
  }
    @media (min-width: 860px) {
  .fab-keranjang, .tutup-keranjang-mobile { display: none; }
  }

    @media (min-width: 860px) {
      .panel-keranjang { border-top: none; }
    }
    .panel-keranjang h2 { font-size: 14px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

    .baris-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .baris-item .info { flex: 1; }
    .baris-item .info .nama { font-weight: 600; }
    .baris-item .info .varian { font-size: 12px; color: var(--muted); }
    .baris-item .jml { font-size: 18px; color: var(--muted); }
    .baris-item .subtotal { width: 78px; text-align: right; font-variant-numeric: tabular-nums; }
    .baris-item .hapus { color: var(--warn); cursor: pointer; font-size: 12px; padding-left: 4px; }

    .kosong { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; grid-column: 1 / -1; }

    .ringkasan { margin-top: auto; padding-top: 12px; }
    .ringkasan .baris {
      display: flex; justify-content: space-between;
      font-size: 14px; margin-bottom: 6px;
    }
    .ringkasan .total { font-size: 24px; font-weight: 700; }
    .ringkasan input {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      margin: 6px 0;
    }
    .ringkasan input.error { border-color: var(--warn); }
    .goyang { animation: goyangInput .4s ease; }
    @keyframes goyangInput {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
    .hint-nama {
      display: none;
      color: var(--warn);
      font-size: 12px;
      margin: -2px 0 6px;
    }
    .hint-nama.tampil { display: block; }
    .catatan-bayar {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #fff3d6;
      color: #7a4a00;
      font-size: 13px;
      line-height: 1.5;
    }
    .catatan-bayar .ikon { flex-shrink: 0; }
    .btn-coba-lagi {
      margin-top: 10px;
      padding: 10px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
    }

    button.selesai {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      background: #25D366;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform .08s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button.selesai:disabled { background: #a9b3ac; cursor: not-allowed; }
    button.selesai:hover:not(:disabled) { background: #1ebe5a; }

    .pesan { font-size: 13px; padding: 8px 10px; border-radius: 8px; margin-top: 10px; }
    .pesan.error { background: #fbe9e5; color: var(--warn); }

    .bola-terbang {
      position: fixed;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--ink);
      z-index: 200;
      pointer-events: none;
      transform: translate(-50%, -50%);
      transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .45s ease;
      opacity: 1;
    }
    .bola-terbang.terbang {
      transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.25);
      opacity: 0;
    }
  </style>
</head>
<body>

  <header>
    <h1>MIG Digital Printing</h1>
    <span id="jam-header"></span>
  </header>

  <div class="keterangan">
    <span class="ikon">📌</span>
    <span>Khusus <b>Batik</b> dan <b>Baju Praktik</b>: Alur pesanan lewat WhatsApp dulu. Barang baru bisa diambil mulai jam <b>4 sore</b> di hari yang sama.</span>
  </div>

  <div class="layout">
    <div class="panel-produk">
      <div class="filters">
        <input type="text" id="cari" placeholder="Cari nama produk...">
      </div>
      <div class="kategori-pills" id="kategori-pills"></div>
      <div class="grid-produk" id="grid-produk"></div>
    </div>

    <div class="panel-keranjang">
      <div class="drag-handle"></div>
      <button class="tutup-keranjang-mobile" onclick="toggleKeranjangMobile()">✕</button>
      <h2>Keranjang</h2>
      <div id="daftar-keranjang">
        <div class="kosong">Belum ada barang dipilih.</div>
      </div>

      <div class="ringkasan">
        <div class="baris"><span>Total</span><span class="total" id="teks-total">Rp 0</span></div>
        <input type="text" id="input-nama" placeholder="Nama pembeli" autocomplete="name">
        <div class="hint-nama" id="hint-nama">Isi nama dulu ya, biar pesanannya jelas.</div>
        <div class="catatan-bayar">
          <span class="ikon">💵</span>
          <span>Mohon siapkan <b>uang pas</b> ya, biar pengambilan lebih cepat.</span>
        </div>
        <button class="selesai" id="btn-selesai" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.72.45 3.4 1.31 4.88L2.05 22l5.36-1.41c1.42.78 3.02 1.19 4.63 1.19h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0012.04 2z"/></svg>
          Pesan via WhatsApp
        </button>
        <div id="area-pesan"></div>
      </div>
    </div>
  </div>

  <button class="fab-keranjang" id="ikon-keranjang" onclick="toggleKeranjangMobile()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"></circle>
      <circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>
    <span class="badge-keranjang" id="badge-keranjang">0</span>
  </button>

  <div class="modal-overlay" id="modal-overlay" onclick="tutupModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <button class="modal-tutup" onclick="tutupModal()">✕</button>
      <div class="modal-gambar-wrap" id="modal-gambar-wrap"></div>
      <div class="modal-scroll">
        <div id="modal-konten"></div>
      </div>
      <div class="modal-footer" id="modal-footer"></div>
    </div>
  </div>

  <script>
    // GANTI dengan URL Web App Apps Script kasir kamu (yang formatnya .../exec)
    const URL_API = 'https://script.google.com/macros/s/AKfycbyAp5STZklpa_MuiokFpIWDgonX51I5ZSD4gBylnhkh77uCpeLmMrCnuhCGcFZTGOA-/exec';

    const NOMOR_WA = '6289510405562';

    const DIMENSI = ['Jurusan', 'Tipe Lengan', 'Ukuran', 'Jenis Kelamin'];
    const DIMENSI_FOTO = ['Jurusan', 'Tipe Lengan', 'Jenis Kelamin']; // kolom yang biasanya bikin tampilan foto beda
    const URUTAN_UKURAN = ['S', 'M', 'L', 'XL', 'XXL', '2XL', '3XL', '4XL'];

    // Keterangan tambahan per produk — dicocokkan lewat nama produk (huruf
    // besar/kecil & spasi berlebih diabaikan). Cukup ubah teks di sini kalau
    // isi paketnya berubah; tidak perlu ubah Google Sheet.
    //   satuan : tampil sebagai "/ set" di samping harga
    //   isi    : kalimat pendek di bawah nama produk (di dalam modal)
    const INFO_PRODUK = {
      'atribut psas':    { satuan: 'set', isi: 'Harga per set. Isi: Bendera Merah Putih, badge nama sekolah, badge OSIS, dan logo sekolah.' },
      'atribut pramuka': { satuan: 'set', isi: 'Harga per set. Isi: badge Jawa Barat dan 2 badge Pramuka (ungu dan coklat).' },
      'kaos olahraga':   { satuan: 'set', isi: 'Harga per set: kaos + celana.' },
      'baju praktik':    { satuan: 'set', isi: 'Harga per set: baju + celana.' },
      'baju batik':      { isi: 'Baju saja, tanpa celana.' }
    };

    // Gambar tabel ukuran (dibuat di Figma, diekspor jadi JPG/PNG). Isi dengan
    // nama file yang ditaruh sejajar index.html, misal 'panduan-baju-praktik.jpg'.
    // Selama masih kosong (''), link "Panduan ukuran" tidak muncul.
    const PANDUAN_UKURAN = {
      'baju praktik':  '',
      'kaos olahraga': '',
      'baju batik':    ''
    };

    let semuaProduk = [];
    let grupProduk = [];
    let pilihanGrup = {};
    let keranjang = {};
    let modalTerbuka = null;
    let kategoriAktif = ''; // '' berarti "Semua"

    document.getElementById('jam-header').textContent = new Date().toLocaleDateString('id-ID', {
      weekday: 'long', day: 'numeric', month: 'long'
    });

    function formatRupiah(angka) {
      return 'Rp ' + Number(angka).toLocaleString('id-ID');
    }

    function kunciNama(nama) {
      return String(nama || '').trim().toLowerCase();
    }
    function infoProduk(nama) {
      return INFO_PRODUK[kunciNama(nama)] || {};
    }
    function urlPanduanUkuran(nama) {
      return PANDUAN_UKURAN[kunciNama(nama)] || '';
    }

    // Minta versi kecil dari foto Google supaya kartu di daftar tidak mengunduh
    // foto ukuran penuh. URL yang bukan dari Google dibiarkan apa adanya.
    function kecilkanGambar(url, lebar) {
      if (!url) return url;
      // Bentuk Drive thumbnail: ...thumbnail?id=XXX&sz=w1000
      if (/[?&]sz=/.test(url)) return url.replace(/([?&]sz=)[^&]*/, '$1w' + lebar);
      // Bentuk lh3: https://lh3.googleusercontent.com/d/ID  (ukuran lewat akhiran =wNNN)
      if (/^https:\/\/lh3\.googleusercontent\.com\//.test(url) && url.indexOf('?') === -1) {
        return url.replace(/=[swh]\d[^\/]*$/, '') + '=w' + lebar;
      }
      return url;
    }

    // Kalau foto gagal dimuat (misal file di Drive belum dibuka untuk umum),
    // ganti dengan placeholder — bukan ikon gambar rusak bawaan browser.
    function fotoGagal(img) {
      const pengganti = document.createElement('div');
      pengganti.className = 'fallback-foto';
      const sudahHabis = img.parentNode && img.parentNode.querySelector('.label-habis');
      pengganti.innerHTML = IKON_FOTO_KOSONG + (sudahHabis ? '' : '<span>Foto belum tersedia</span>');
      img.replaceWith(pengganti);
    }

    // Simpan daftar produk terakhir di HP pembeli: kunjungan berikutnya langsung
    // menampilkan produk (tanpa nunggu Apps Script), lalu diperbarui di belakang layar.
    const KUNCI_CACHE = 'mig_produk_v1';
    function bacaCache() {
      try {
        const mentah = localStorage.getItem(KUNCI_CACHE);
        if (!mentah) return null;
        const obj = JSON.parse(mentah);
        return obj && Array.isArray(obj.data) && obj.data.length ? obj.data : null;
      } catch (e) { return null; }
    }
    function simpanCache(data) {
      try { localStorage.setItem(KUNCI_CACHE, JSON.stringify({ t: Date.now(), data: data })); } catch (e) {}
    }

    function tampilSkeleton(jumlah) {
      const kartu = '<div class="kartu-skeleton"><div class="skeleton-gambar"></div><div class="skeleton-baris panjang"></div><div class="skeleton-baris pendek"></div></div>';
      document.getElementById('grid-produk').innerHTML = kartu.repeat(jumlah);
    }

    // FIX: sekarang backend doGet membungkus semua response jadi
    // { sukses: true/false, data / error } (biar konsisten dengan action-action
    // lain buat kasir di Vercel). Jadi di sini kita harus ambil `respon.data`,
    // BUKAN `respon` langsung seperti sebelumnya — kalau tidak, kelompokkanProduk()
    // akan gagal (list.forEach bukan array) dan halaman nyangkut di skeleton
    // tanpa pesan error sama sekali.
    function terapkanData(data) {
      semuaProduk = data;
      grupProduk = kelompokkanProduk(data);
      isiFilterKategori();
      renderProduk();
      if (modalTerbuka) renderModal();
    }

    function tampilGagalMuat(pesan) {
      document.getElementById('grid-produk').innerHTML =
        '<div class="kosong">Gagal memuat produk' + (pesan ? ': ' + pesan : '') + '.<br>' +
        '<button type="button" class="btn-coba-lagi" onclick="muatProduk()">Coba lagi</button></div>';
    }

    function muatProduk() {
      // Ada salinan lama di HP? Tampilkan dulu; kalau tidak, skeleton.
      const cache = bacaCache();
      if (cache) terapkanData(cache); else tampilSkeleton(8);
      const adaCache = !!cache;

      const namaCallback = 'cbProduk' + Date.now();
      const tagScript = document.createElement('script');
      let pewaktu = null;
      let selesai = false;

      function bersihkan() {
        selesai = true;
        clearTimeout(pewaktu);
        delete window[namaCallback];
        tagScript.remove();
      }

      window[namaCallback] = function (respon) {
        if (selesai) return;
        bersihkan();

        if (!respon || !respon.sukses) {
          // Salinan lama tetap dipakai kalau ada; error cuma ditampilkan kalau layar kosong.
          if (!adaCache) tampilGagalMuat(respon && respon.error ? respon.error : '');
          return;
        }
        simpanCache(respon.data);
        terapkanData(respon.data);
      };

      tagScript.src = URL_API + '?callback=' + namaCallback;
      tagScript.onerror = function () {
        if (selesai) return;
        bersihkan();
        if (!adaCache) tampilGagalMuat('');
      };
      // Apps Script kadang menggantung tanpa error sama sekali — beri batas waktu.
      pewaktu = setTimeout(function () {
        if (selesai) return;
        bersihkan();
        if (!adaCache) tampilGagalMuat('koneksi terlalu lama');
      }, 20000);

      document.body.appendChild(tagScript);
    }

    function kelompokkanProduk(list) {
      const grup = {};
      list.forEach(p => {
        // .trim() biar spasi berlebih di sheet (misal "Atribut Pramuka " vs
        // "Atribut Pramuka") gak bikin produk yang sama dianggap 2 produk beda
        const namaBersih = String(p['Nama Produk'] || '').trim();
        const key = p.Kategori + '||' + namaBersih;
        if (!grup[key]) grup[key] = { key: key, kategori: p.Kategori, nama: namaBersih, gambar: '', rows: [] };
        if (!grup[key].gambar && p.Gambar) grup[key].gambar = p.Gambar;
        grup[key].rows.push(p);
      });
      return Object.values(grup);
    }

    function hargaTampil(grup) {
      const hargaUnik = [...new Set(grup.rows.map(r => Number(r.Harga)))];
      if (hargaUnik.length === 1) return formatRupiah(hargaUnik[0]);
      return 'Mulai ' + formatRupiah(Math.min(...hargaUnik));
    }

    function dimensiPerluPilihan(rows) {
      return DIMENSI.filter(dim => {
        const nilai = new Set(rows.map(r => r[dim]).filter(v => v !== '' && v !== undefined && v !== null));
        return nilai.size >= 2;
      });
    }

    function urutkanNilai(dim, nilai) {
      if (dim === 'Ukuran') {
        return nilai.sort((a, b) => {
          const ia = URUTAN_UKURAN.indexOf(a), ib = URUTAN_UKURAN.indexOf(b);
          if (ia === -1 && ib === -1) return a.localeCompare(b);
          if (ia === -1) return 1;
          if (ib === -1) return -1;
          return ia - ib;
        });
      }
      return nilai.sort();
    }

    function barisCocokDimensiLain(rows, dimsLain, pilihan) {
      return rows.filter(r => dimsLain.every(d => !pilihan[d] || r[d] === pilihan[d]));
    }

    // Pil kategori — otomatis muncul "Semua" + tiap kategori yang ada di data,
    // jadi kalau nanti ada kategori baru gak perlu ubah kode
    function isiFilterKategori() {
      const wadah = document.getElementById('kategori-pills');
      const kategoriSet = [...new Set(semuaProduk.map(p => p.Kategori).filter(Boolean))];
      const daftar = ['', ...kategoriSet];
      wadah.innerHTML = daftar.map(k => {
        const aktif = kategoriAktif === k;
        return `<button type="button" class="pil-kategori ${aktif ? 'aktif' : ''}"
          onclick="pilihKategori('${k}')">${k === '' ? 'Semua' : k}</button>`;
      }).join('');
    }

    function pilihKategori(k) {
      kategoriAktif = k;
      isiFilterKategori();
      renderProduk();
    }

    function renderProduk() {
      const kataCari = document.getElementById('cari').value.toLowerCase();
      const kategori = kategoriAktif;

      const hasil = grupProduk.filter(g => {
        if (kataCari && !g.nama.toLowerCase().includes(kataCari)) return false;
        if (kategori && g.kategori !== kategori) return false;
        return true;
      });

      const grid = document.getElementById('grid-produk');
      if (hasil.length === 0) {
        grid.innerHTML = '<div class="kosong">Tidak ada produk cocok.</div>';
        return;
      }

      grid.innerHTML = hasil.map(g => renderKartuGrid(g)).join('');
    }

    // Ikon placeholder saat produk belum punya foto — disamakan persis dengan kasir
    const IKON_FOTO_KOSONG = `
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <path d="M21 15l-5-5L5 21"></path>
      </svg>`;

    function renderKartuGrid(grup) {
      const totalStok = grup.rows.reduce((s, r) => s + Number(r.Stok || 0), 0);
      const habisSemua = totalStok <= 0;
      const info = infoProduk(grup.nama);
      const satuan = info.satuan ? ` <span class="satuan">/ ${info.satuan}</span>` : '';

      // Kartu habis + belum ada foto: cukup badge "Stok Habis" saja — jangan
      // ditumpuk tulisan "Belum ada foto" di bawahnya.
      let isiGambar = '';
      if (grup.gambar) {
        isiGambar = `<img class="foto-produk" src="${kecilkanGambar(grup.gambar, 480)}" alt="${grup.nama}" loading="lazy" decoding="async" onerror="fotoGagal(this)">`;
      } else if (!habisSemua) {
        isiGambar = `<div class="fallback-foto">${IKON_FOTO_KOSONG}<span>Belum ada foto</span></div>`;
      }

      return `
        <button type="button" class="kartu-grid" ${habisSemua ? 'disabled' : `onclick="bukaModalProduk('${grup.key}')"`}>
          <div class="gambar-produk" style="${habisSemua ? 'filter:grayscale(1);' : ''}">
            ${isiGambar}
            ${habisSemua ? '<div class="label-habis"><span>Stok Habis</span></div>' : ''}
          </div>
          <div class="info-grid">
            <div class="nama-grid">${grup.nama}</div>
            <div class="harga-grid">${hargaTampil(grup)}${satuan}</div>
          </div>
        </button>`;
    }

    function bukaModalProduk(groupKey) {
      modalTerbuka = groupKey;
      renderModal();
      document.getElementById('modal-overlay').classList.add('terbuka');
      document.body.style.overflow = 'hidden';
    }

    function tutupModal() {
      modalTerbuka = null;
      document.getElementById('modal-overlay').classList.remove('terbuka');
      document.body.style.overflow = '';
    }

    function renderModal() {
      if (!modalTerbuka) return;
      const grup = grupProduk.find(g => g.key === modalTerbuka);
      if (!grup) { tutupModal(); return; }
      const hasil = renderIsiModal(grup);
      document.getElementById('modal-gambar-wrap').innerHTML = hasil.gambar;
      document.getElementById('modal-konten').innerHTML = hasil.konten;
      document.getElementById('modal-footer').innerHTML = hasil.footer;
    }

    // Isi modal detail produk: foto (ikut berubah sesuai varian), pilihan chip,
    // info harga/stok, dan tombol Tambah. Dipecah jadi { gambar, konten, footer }:
    // gambar & footer dirender di luar area scroll (.modal-gambar-wrap /
    // .modal-footer) supaya selalu kelihatan tanpa perlu digulir dulu.
    function renderIsiModal(grup) {
      if (!pilihanGrup[grup.key]) pilihanGrup[grup.key] = { qty: 1 };
      const pilihan = pilihanGrup[grup.key];
      const dimsPerlu = dimensiPerluPilihan(grup.rows);
      const info = infoProduk(grup.nama);
      const urlPanduan = urlPanduanUkuran(grup.nama);
      const satuan = info.satuan ? ` <span class="satuan">/ ${info.satuan}</span>` : '';

      let htmlChip = '';
      dimsPerlu.forEach(dim => {
        const dimsLain = dimsPerlu.filter(d => d !== dim);
        const semuaNilai = urutkanNilai(dim, [...new Set(grup.rows.map(r => r[dim]).filter(v => v))]);
        htmlChip += `
          <div class="grup-chip">
            <div class="label-chip ${dim === 'Ukuran' && urlPanduan ? 'ada-link' : ''}">
              <span>${dim === 'Tipe Lengan' ? 'Lengan' : dim}</span>
              ${dim === 'Ukuran' && urlPanduan ? `<a class="link-panduan" href="${urlPanduan}" target="_blank" rel="noopener">Panduan ukuran</a>` : ''}
            </div>
            <div class="chip-baris">
              ${semuaNilai.map(v => {
                const kandidat = barisCocokDimensiLain(grup.rows, dimsLain, pilihan).filter(r => r[dim] === v);
                const adaStok = kandidat.some(r => Number(r.Stok) > 0);
                const aktif = pilihan[dim] === v;
                const kelas = ['chip'];
                if (aktif) kelas.push('aktif');
                if (!adaStok) kelas.push('habis');
                return `<div class="${kelas.join(' ')}"
                  ${adaStok ? `onclick="pilihChip('${grup.key}', '${dim}', '${v}')"` : ''}
                  >${v}</div>`;
              }).join('')}
            </div>
          </div>`;
      });

      const semuaTerpilih = dimsPerlu.every(dim => pilihan[dim]);
      let barisTerpilih = null;
      if (dimsPerlu.length === 0) {
        barisTerpilih = grup.rows[0];
      } else if (semuaTerpilih) {
        barisTerpilih = grup.rows.find(r => dimsPerlu.every(dim => r[dim] === pilihan[dim]));
      }

      // Harga & stok dirender di footer (di atas tombol), bukan di area scroll.
      // Tulisan tombol Tambah ikut memberi tahu apa yang masih kurang.
      let htmlInfo, tombolAktif = false, teksTombol = 'Tambah';
      if (barisTerpilih) {
        const stok = Number(barisTerpilih.Stok);
        const habis = stok <= 0;
        const rendah = !habis && stok <= 5;
        tombolAktif = !habis;
        if (habis) teksTombol = 'Stok habis';
        // Jumlah stok mentah tidak perlu diketahui pembeli: cukup "Tersedia",
        // atau "Sisa n" kalau tinggal sedikit.
        const teksStok = habis ? 'Stok habis' : (rendah ? 'Sisa ' + stok : 'Tersedia');
        htmlInfo = `
          <div class="info-pilihan">
            <span class="harga">${formatRupiah(barisTerpilih.Harga)}${satuan}</span>
            <span class="stok ${rendah ? 'rendah' : ''}">${teksStok}</span>
          </div>`;
      } else {
        const belum = dimsPerlu.find(dim => !pilihan[dim]);
        teksTombol = belum
          ? 'Pilih ' + (belum === 'Tipe Lengan' ? 'lengan' : belum.toLowerCase()) + ' dulu'
          : 'Kombinasi tidak tersedia';
        htmlInfo = `
          <div class="info-pilihan">
            <span class="harga">${hargaTampil(grup)}${satuan}</span>
          </div>`;
      }

      // Foto ikut ganti begitu varian (Jurusan/Lengan/Jenis Kelamin) dipilih —
      // dicocokkan SEKALIGUS semua yang sudah dipilih (misal Jurusan + Lengan
      // bareng buat Baju Praktik), TIDAK nunggu Ukuran ikut lengkap.
      let gambarDipakai = grup.gambar;
      const dimsDipilih = DIMENSI_FOTO.filter(dim => pilihan[dim]);
      if (dimsDipilih.length) {
        const barisFoto = grup.rows.find(r =>
          r.Gambar && dimsDipilih.every(dim => r[dim] === pilihan[dim])
        );
        if (barisFoto) gambarDipakai = barisFoto.Gambar;
      }

      const gambar = `
        <div class="modal-gambar ${dimsPerlu.length ? 'ringkas' : ''}" ${gambarDipakai ? `style="background-image:url('${kecilkanGambar(gambarDipakai, 800)}')"` : ''}>
          ${!gambarDipakai ? `<div class="fallback-foto">${IKON_FOTO_KOSONG}<span>Belum ada foto</span></div>` : ''}
        </div>`;

      const konten = `
        <div class="header-produk">
          <div class="nama">${grup.nama}</div>
          <div class="kategori">${grup.kategori}</div>
        </div>
        ${info.isi ? `<div class="ket-produk">${info.isi}</div>` : ''}
        ${dimsPerlu.length ? `<div class="baris-dropdown">${htmlChip}</div>` : ''}`;

      const footer = `
        ${htmlInfo}
        <div class="baris-aksi">
          <div class="qty-ctl">
            <button onclick="ubahQty('${grup.key}', -1)">−</button>
            <span>${pilihan.qty}</span>
            <button onclick="ubahQty('${grup.key}', 1)">+</button>
          </div>
          <button class="btn-tambah" ${tombolAktif ? '' : 'disabled'}
            onclick="tambahKeKeranjang(event, '${grup.key}')">${teksTombol}</button>
        </div>`;

      return { gambar, konten, footer };
    }

    function pilihChip(groupKey, dim, value) {
      const pilihan = pilihanGrup[groupKey];
      pilihan[dim] = pilihan[dim] === value ? undefined : value;
      renderModal();
    }

    function ubahQty(groupKey, delta) {
      const pilihan = pilihanGrup[groupKey];
      pilihan.qty = Math.max(1, (pilihan.qty || 1) + delta);
      renderModal();
    }

    // Catatan: qty di keranjang cuma dipakai buat susun pesan WA — TIDAK memotong Stok di Sheet.
    function tambahKeKeranjang(evt, groupKey) {
      const tombolAsal = evt ? evt.currentTarget : null;
      const grup = grupProduk.find(g => g.key === groupKey);
      const pilihan = pilihanGrup[groupKey];
      const dimsPerlu = dimensiPerluPilihan(grup.rows);
      const barisTerpilih = dimsPerlu.length === 0
        ? grup.rows[0]
        : grup.rows.find(r => dimsPerlu.every(dim => r[dim] === pilihan[dim]));
      if (!barisTerpilih) return;

      const id = barisTerpilih.ID;
      const tambah = pilihan.qty || 1;

      if (!keranjang[id]) keranjang[id] = { produk: barisTerpilih, jumlah: 0 };
      keranjang[id].jumlah += tambah;

      efekTerbangKeKeranjang(tombolAsal);
      pilihan.qty = 1;
      renderKeranjang();
      renderProduk();
      tutupModal();
    }

    // FIX: sebelumnya pengecekan visibilitas ikon keranjang pakai
    // `ikon.offsetParent !== null`. Ini SELALU false untuk elemen yang
    // `position: fixed` (perilaku standar browser, bukan bug) — dan FAB
    // keranjang di halaman pembeli ini memang `position: fixed`. Akibatnya
    // target animasi SELALU jatuh ke elemen cadangan (<h2>Keranjang</h2>)
    // yang di mode mobile lagi disembunyikan di luar layar, jadi bola
    // terbang & efek "pop" itu sebenarnya tetap jalan tapi menuju target
    // yang gak kelihatan. Diganti pakai getComputedStyle().display supaya
    // deteksi visibilitasnya akurat walau elemennya position: fixed.
    function efekTerbangKeKeranjang(tombolAsal) {
      const ikon = document.getElementById('ikon-keranjang');
      const ikonTampil = ikon && getComputedStyle(ikon).display !== 'none';
      const target = ikonTampil ? ikon : document.querySelector('.panel-keranjang h2');
      if (!target || !tombolAsal) return;

      const asal = tombolAsal.getBoundingClientRect();
      const tujuan = target.getBoundingClientRect();
      const dx = (tujuan.left + tujuan.width / 2) - (asal.left + asal.width / 2);
      const dy = (tujuan.top + tujuan.height / 2) - (asal.top + asal.height / 2);

      const bola = document.createElement('div');
      bola.className = 'bola-terbang';
      bola.style.left = (asal.left + asal.width / 2) + 'px';
      bola.style.top = (asal.top + asal.height / 2) + 'px';
      bola.style.setProperty('--dx', dx + 'px');
      bola.style.setProperty('--dy', dy + 'px');
      document.body.appendChild(bola);

      requestAnimationFrame(() => bola.classList.add('terbang'));
      setTimeout(() => {
        bola.remove();
        target.classList.add('pop');
        setTimeout(() => target.classList.remove('pop'), 350);
      }, 450);
    }

    function labelVarian(p) {
      return [p.Jurusan, p['Tipe Lengan'], p.Ukuran].filter(Boolean).join(' · ');
    }

    function hapusItem(id) {
      delete keranjang[id];
      renderKeranjang();
    }

    function hitungTotal() {
      return Object.values(keranjang).reduce((sum, item) => sum + item.produk.Harga * item.jumlah, 0);
    }

    function hitungJumlahItem() {
      return Object.values(keranjang).reduce((sum, item) => sum + item.jumlah, 0);
    }

    function renderKeranjang() {
      const wadah = document.getElementById('daftar-keranjang');
      const daftar = Object.entries(keranjang);

      if (daftar.length === 0) {
        wadah.innerHTML = '<div class="kosong">Belum ada barang dipilih.</div>';
      } else {
        wadah.innerHTML = daftar.map(([id, item]) => `
          <div class="baris-item">
            <div class="info">
              <div class="nama">${item.produk['Nama Produk']}</div>
              <div class="varian">${labelVarian(item.produk)}</div>
            </div>
            <div class="jml">x${item.jumlah}</div>
            <div class="subtotal">${formatRupiah(item.produk.Harga * item.jumlah)}</div>
            <span class="hapus" onclick="hapusItem('${id}')">✕</span>
          </div>`).join('');
      }

      const total = hitungTotal();
      document.getElementById('teks-total').textContent = formatRupiah(total);
      const badge = document.getElementById('badge-keranjang');
      if (badge) badge.textContent = hitungJumlahItem();
      perbaruiTombolSelesai();
    }

    function perbaruiTombolSelesai() {
      const total = hitungTotal();
      document.getElementById('btn-selesai').disabled = (total === 0);
    }

    function tampilPesan(jenis, teks) {
      const area = document.getElementById('area-pesan');
      area.innerHTML = `<div class="pesan ${jenis}">${teks}</div>`;
      setTimeout(() => { area.innerHTML = ''; }, 4000);
    }

    // Susun teks pesanan lalu buka WhatsApp — TIDAK memanggil backend apa pun,
    // jadi Stok di Google Sheet sama sekali tidak berubah dari sini.
    function kirimKeWhatsapp() {
      const daftar = Object.values(keranjang);
      const inputNama = document.getElementById('input-nama');
      const nama = inputNama.value.trim();
      const hintNama = document.getElementById('hint-nama');

      if (daftar.length === 0) return;

      if (!nama) {
        inputNama.classList.add('error');
        hintNama.classList.add('tampil');
        inputNama.classList.remove('goyang');
        void inputNama.offsetWidth; // reset animasi biar bisa geter berkali-kali walau diklik beruntun
        inputNama.classList.add('goyang');
        inputNama.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      let teks = 'Halo MIG Digital Printing, saya mau pesan:\n\n';
      daftar.forEach((item, i) => {
        const varian = labelVarian(item.produk);
        teks += `${i + 1}. ${item.produk['Nama Produk']}${varian ? ' (' + varian + ')' : ''} x${item.jumlah} = ${formatRupiah(item.produk.Harga * item.jumlah)}\n`;
      });
      teks += `\n*Total: ${formatRupiah(hitungTotal())}*`;
      teks += `\nNama: ${nama}`;

      const url = 'https://wa.me/' + NOMOR_WA + '?text=' + encodeURIComponent(teks);
      window.open(url, '_blank');
    }

    function setKeranjangMobile(buka) {
      const panel = document.querySelector('.panel-keranjang');
      panel.style.transform = ''; // pastikan gak ada sisa transform dari drag yang nyangkut
      panel.classList.toggle('buka', buka);
    }

    function toggleKeranjangMobile() {
      const panel = document.querySelector('.panel-keranjang');
      setKeranjangMobile(!panel.classList.contains('buka'));
    }

    // Swipe-to-close: bisa dimulai dari mana aja di dalam sheet, SELAMA daftar
    // isi keranjang lagi di posisi paling atas (scrollTop 0) — pola bottom-sheet
    // standar (sama seperti di kasir), biar gak konflik sama scroll isi keranjang.
    (function aturSwipeKeranjang() {
      const panel = document.querySelector('.panel-keranjang');
      let mulaiY = null;
      let geser = 0;
      let sedangMenyeret = false;

      function mulai(e) {
        if (!panel.classList.contains('buka')) { mulaiY = null; return; }
        mulaiY = e.touches[0].clientY;
        geser = 0;
        sedangMenyeret = false;
      }
      function bergerak(e) {
        if (mulaiY === null) return;
        const deltaY = e.touches[0].clientY - mulaiY;
        if (!sedangMenyeret) {
          if (deltaY > 0 && panel.scrollTop <= 0) {
            sedangMenyeret = true;
            panel.classList.add('menyeret');
          } else {
            return;
          }
        }
        geser = Math.max(0, deltaY);
        panel.style.transform = `translateY(${geser}px)`;
        e.preventDefault();
      }
      function selesai() {
        if (mulaiY === null) return;
        const memangMenyeret = sedangMenyeret;
        sedangMenyeret = false;
        mulaiY = null;
        if (!memangMenyeret) return;
        panel.classList.remove('menyeret');
        setKeranjangMobile(geser <= 60);
        geser = 0;
      }

      panel.addEventListener('touchstart', mulai, { passive: true });
      panel.addEventListener('touchmove', bergerak, { passive: false });
      panel.addEventListener('touchend', selesai);
      panel.addEventListener('touchcancel', selesai);

      document.addEventListener('visibilitychange', () => {
        if (document.hidden && sedangMenyeret) selesai();
      });
    })();

    document.getElementById('cari').addEventListener('input', renderProduk);
    document.getElementById('input-nama').addEventListener('input', function () {
      this.classList.remove('error');
      document.getElementById('hint-nama').classList.remove('tampil');
      perbaruiTombolSelesai();
    });
    document.getElementById('btn-selesai').addEventListener('click', kirimKeWhatsapp);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modalTerbuka) tutupModal();
    });

    muatProduk();
  </script>
</body>
</html>
